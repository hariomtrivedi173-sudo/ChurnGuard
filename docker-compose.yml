services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: churnguard_backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    volumes:
      - backend_uploads:/app/backend/uploads
      - backend_reports:/app/reports
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: churnguard_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
  backend_reports:
