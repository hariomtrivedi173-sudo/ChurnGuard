<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="cgGradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="50%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="shieldStroke" x1="14" y1="12" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>
    <filter id="cgGlow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect width="48" height="48" rx="12" fill="url(#cgGradient)" />
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" stroke="#818CF8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Shield Mark -->
  <path d="M24 11C24 11 15 13.5 15 20.25C15 29.25 24 36.75 24 36.75C24 36.75 33 29.25 33 20.25C33 13.5 24 11 24 11Z"
        stroke="url(#shieldStroke)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="rgba(238, 242, 255, 0.12)" />

  <!-- Center AI Node / Pulse -->
  <circle cx="24" cy="22" r="3.2" fill="#FFFFFF" />
  <circle cx="24" cy="22" r="6" stroke="#C7D2FE" stroke-opacity="0.5" stroke-width="1" />
  <path d="M24 25.2V28.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>
