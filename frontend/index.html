<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChurnGuard — AI-powered customer churn prediction and retention intelligence system" />
    <title>ChurnGuard — AI Churn Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 5rem;
      }
      body {
        margin: 0;
        background-color: hsl(330, 8%, 98%);
      }
      html.dark body {
        background-color: hsl(330, 9%, 7%);
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto !important;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme');
          if (!t) {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = 'hsl(330, 9%, 7%)';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = 'hsl(330, 8%, 98%)';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
